[package]
name = "researchweave-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
researchweave-core = { path = "../researchweave-core", version = "=0.1.0" }
ambers = "=0.4.6"
arrow-array-57 = { package = "arrow-array", version = "=57.1.0" }
arrow-array-60 = { package = "arrow-array", version = "=60.0.0" }
arrow-json-57 = { package = "arrow-json", version = "=57.1.0" }
arrow-json-60 = { package = "arrow-json", version = "=60.0.0" }
arrow-schema-60 = { package = "arrow-schema", version = "=60.0.0" }
base64 = "0.22"
calamine = "=0.37.0"
csv = "1.3"
dta = "=0.6.0"
hex.workspace = true
nalgebra = "=0.33.2"
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "brotli", "flate2-zlib-rs", "lz4", "snap", "zstd"] }
png = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
statrs = "0.18"
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }
unicode-ident = "1"

[dev-dependencies]
rust_xlsxwriter = "=0.101.0"
tempfile = "3"
uuid = "1"

