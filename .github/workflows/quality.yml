name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra formats
      - name: Lint
        run: uv run --extra dev --extra formats python scripts/tasks.py lint
      - name: Type check
        run: uv run --extra dev --extra formats python scripts/tasks.py types
      - name: Validate skills
        run: uv run --extra dev --extra formats python scripts/tasks.py skills
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --extra dev --extra formats python scripts/tasks.py test
