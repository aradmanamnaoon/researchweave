name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --extra dev python scripts/tasks.py lint
      - name: Type check
        run: uv run --extra dev python scripts/tasks.py types
      - name: Validate skills
        run: uv run --extra dev python scripts/tasks.py skills
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --extra dev python scripts/tasks.py test
