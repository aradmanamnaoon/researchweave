[workspace]
members = [
    "crates/researchweave-core",
    "crates/researchweave-crypto",
    "crates/researchweave-project",
    "crates/researchweave-desktop",
    "crates/researchweave-analysis",
    "crates/researchweave-evidence",
    "crates/researchweave-ai",
    "crates/researchweave-cli",
    "crates/researchweave-library",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.94.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# The Slint/PDFium desktop link graph produces a very large Windows PDB with
# full debug info and can hit LINK LNK1318 during iterative UI work. Line-table
# debug info keeps development stacks useful without changing release builds.
[profile.dev]
debug = 1

# AccessKit AT-SPI 0.19.1 marks disabled buttons as enabled because it only
# checks is_disabled() when is_read_only_supported(). Until an upstream fix
# is available in our locked Slint dependency graph, use the narrowly patched
# upstream adapter so Linux screen readers receive accurate button states.
[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
