name: Release build verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release-builds.yml"

jobs:
  portable-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
          - os: ubuntu-latest
            build: sh packaging/linux/build.sh
          - os: macos-latest
            build: sh packaging/macos/build.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build portable package
        run: ${{ matrix.build }}
      - name: Upload local build output
        uses: actions/upload-artifact@v4
        with:
          name: researchweave-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
